<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল | MYGRAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f0f2f5; padding: 20px; }
        .admin-card { background: white; max-width: 500px; margin: auto; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { color: #1A374D; text-align: center; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: 'Hind Siliguri'; }
        textarea { height: 100px; resize: none; }
        button { width: 100%; padding: 12px; background: #FF6B35; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .item { display: flex; justify-content: space-between; background: #f9f9f9; padding: 10px; margin-top: 5px; border-radius: 5px; font-size: 14px; align-items: center;}
        .del-btn { color: white; background: red; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>বই ম্যানেজমেন্ট</h2>
        <input type="text" id="title" placeholder="বইয়ের নাম">
        <input type="text" id="author" placeholder="লেখকের নাম">
        <input type="text" id="pub" placeholder="পাবলিকেশন">
        <input type="number" id="price" placeholder="দাম (৳)">
        <input type="text" id="img" placeholder="ছবির লিঙ্ক (URL)">
        <textarea id="desc" placeholder="বইয়ের বিস্তারিত তথ্য..."></textarea>
        
        <button onclick="addBook()">হোমপেজে পাবলিশ করুন</button>

        <div id="adminBookList" style="margin-top: 20px;"></div>
    </div>

    <script>
        function addBook() {
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const pub = document.getElementById('pub').value;
            const price = document.getElementById('price').value;
            const img = document.getElementById('img').value;
            const desc = document.getElementById('desc').value;

            if(!title || !price || !img) { alert("নাম, দাম এবং ছবি আবশ্যক!"); return; }

            const books = JSON.parse(localStorage.getItem('myBooks')) || [];
            books.push({ title, author, pub, price, img, desc, reviews: [] });
            localStorage.setItem('myBooks', JSON.stringify(books));
            
            alert("বই যোগ করা হয়েছে!");
            location.reload();
        }

        function deleteBook(index) {
            let books = JSON.parse(localStorage.getItem('myBooks'));
            books.splice(index, 1);
            localStorage.setItem('myBooks', JSON.stringify(books));
            location.reload();
        }

        window.onload = function() {
            const list = document.getElementById('adminBookList');
            const books = JSON.parse(localStorage.getItem('myBooks')) || [];
            list.innerHTML = "<h3>অ্যাড করা বইসমূহ:</h3>" + books.map((b, i) => `
                <div class="item">
                    <span>${b.title}</span>
                    <button class="del-btn" onclick="deleteBook(${i})">মুছুন</button>
                </div>
            `).join('');
        };
    </script>
</body>
</html>
