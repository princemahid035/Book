<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল | MYGRAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f0f2f5; padding: 20px; }
        .admin-card { background: white; max-width: 500px; margin: auto; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { color: #1A374D; text-align: center; margin-bottom: 20px; }
        h3 { font-size: 18px; margin-top: 20px; color: #333; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: 'Hind Siliguri'; outline: none; }
        input:focus, textarea:focus { border-color: #FF6B35; }
        textarea { height: 100px; resize: none; }
        button.publish-btn { width: 100%; padding: 12px; background: #FF6B35; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .item { display: flex; justify-content: space-between; background: #f9f9f9; padding: 12px; margin-top: 10px; border-radius: 8px; font-size: 14px; align-items: center; border: 1px solid #eee;}
        .del-btn { color: white; background: #eb4d4b; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-family: 'Hind Siliguri'; }
        .back-home { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #1A374D; font-weight: 600; }
    </style>
</head>
<body>

    <div class="admin-card">
        <a href="index.html" class="back-home"><i class="fa fa-arrow-left"></i> হোম পেজে ফিরে যান</a>
        <h2>বই ম্যানেজমেন্ট</h2>
        
        <input type="text" id="title" placeholder="বইয়ের নাম (অবশ্যক)">
        <input type="text" id="author" placeholder="লেখকের নাম">
        <input type="text" id="pub" placeholder="পাবলিকেশন">
        <input type="number" id="price" placeholder="দাম ৳ (অবশ্যক)">
        <input type="text" id="img" placeholder="ছবির লিঙ্ক URL (অবশ্যক)">
        <textarea id="desc" placeholder="বইয়ের বিস্তারিত তথ্য..."></textarea>
        
        <button class="publish-btn" onclick="addBook()">হোমপেজে পাবলিশ করুন</button>

        <div id="adminBookList"></div>
    </div>

    <script>
        // বই যোগ করার ফাংশন
        function addBook() {
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value || "অজানা লেখক";
            const pub = document.getElementById('pub').value || "অজানা পাবলিকেশন";
            const price = document.getElementById('price').value;
            const img = document.getElementById('img').value;
            const desc = document.getElementById('desc').value || "এই বইটির কোনো বর্ণনা দেওয়া হয়নি।";

            if(!title || !price || !img) { 
                alert("দয়া করে নাম, দাম এবং ছবির লিঙ্ক দিন!"); 
                return; 
            }

            const books = JSON.parse(localStorage.getItem('myBooks')) || [];
            
            // নতুন বইয়ের অবজেক্ট (ID সহ)
            const newBook = { 
                id: Date.now().toString(), // ইউনিক আইডি তৈরি
                title, 
                author, 
                pub, 
                price, 
                img, 
                desc, 
                reviews: [] 
            };

            books.push(newBook);
            localStorage.setItem('myBooks', JSON.stringify(books));
            
            alert("সফলভাবে হোম পেজে পাবলিশ হয়েছে!");
            
            // ইনপুট ফিল্ড খালি করা
            document.getElementById('title').value = '';
            document.getElementById('author').value = '';
            document.getElementById('pub').value = '';
            document.getElementById('price').value = '';
            document.getElementById('img').value = '';
            document.getElementById('desc').value = '';

            renderAdminList();
        }

        // বই ডিলিট করার ফাংশন
        function deleteBook(index) {
            if(confirm("আপনি কি নিশ্চিতভাবে এই বইটি মুছে ফেলতে চান?")) {
                let books = JSON.parse(localStorage.getItem('myBooks'));
                books.splice(index, 1);
                localStorage.setItem('myBooks', JSON.stringify(books));
                renderAdminList();
            }
        }

        // অ্যাডমিন লিস্ট দেখানোর ফাংশন
        function renderAdminList() {
            const list = document.getElementById('adminBookList');
            const books = JSON.parse(localStorage.getItem('myBooks')) || [];
            
            if(books.length === 0) {
                list.innerHTML = "<h3>কোনো বই অ্যাড করা নেই</h3>";
                return;
            }

            list.innerHTML = "<h3>অ্যাড করা বইসমূহ:</h3>" + books.map((b, i) => `
                <div class="item">
                    <div>
                        <strong>${b.title}</strong><br>
                        <small>৳ ${b.price}</small>
                    </div>
                    <button class="del-btn" onclick="deleteBook(${i})">মুছুন</button>
                </div>
            `).join('');
        }

        // পেজ লোড হলে লিস্ট দেখানো
        window.onload = renderAdminList;
    </script>
</body>
</html>
