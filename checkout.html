<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | KINO</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --brand-color: #960000; }
        
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background: #ffffff; /* ব্যাকগ্রাউন্ড সাদা */
            margin: 0; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }

        .checkout-wrapper { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; }
        
        .top-bar { display: flex; align-items: center; padding: 10px 0 30px; }
        .back-circle { 
            width: 40px; height: 40px; background: #f8f8f8; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; 
        }

        .order-card { 
            background: #ffffff; 
            border-radius: 24px; 
            padding: 20px; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); 
            border: 1px solid #f0f0f0;
        }

        .product-box { display: flex; align-items: center; gap: 15px; }
        .product-box img { width: 90px; height: 90px; border-radius: 16px; object-fit: cover; background: #f9f9f9; }
        
        .price-text { color: var(--brand-color); font-size: 22px; font-weight: 800; }
        
        .btn-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .action-btn { 
            display: flex; align-items: center; padding: 16px 20px; border-radius: 18px; 
            text-decoration: none; color: white; font-size: 16px; font-weight: 600; 
        }
        .btn-wa { background: #25D366; }
        .btn-ms { background: #0084FF; }
        .btn-call { background: var(--brand-color); }
    </style>
</head>
<body>

<div class="checkout-wrapper">
    <div class="top-bar">
        <div class="back-circle" onclick="history.back()">
            <i class="fa fa-arrow-left"></i>
        </div>
        <div style="flex:1; text-align:center; font-weight:700; font-size:18px; margin-right:40px;">চেকআউট</div>
    </div>

    <div class="order-card" id="briefContent">
        <p style="text-align:center;">তথ্য লোড হচ্ছে...</p>
    </div>

    <div class="btn-stack">
        <a href="#" id="waLink" class="action-btn btn-wa" target="_blank">
            <i class="fab fa-whatsapp" style="font-size:20px; margin-right:10px;"></i> হোয়াটসঅ্যাপে অর্ডার করুন
        </a>
        <a href="#" id="msLink" class="action-btn btn-ms" target="_blank">
            <i class="fab fa-facebook-messenger" style="font-size:20px; margin-right:10px;"></i> মেসেঞ্জারে অর্ডার করুন
        </a>
        <a href="tel:+8801700000000" class="action-btn btn-call">
            <i class="fa-solid fa-phone-volume" style="font-size:20px; margin-right:10px;"></i> সরাসরি কল করুন
        </a>
    </div>
</div>

<script>
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const pName = params.get('name');
        const db = JSON.parse(localStorage.getItem('wordrobe_db')) || {};
        let foundProduct = null;

        Object.keys(db).forEach(key => {
            const item = db[key].find(p => p.title === pName);
            if (item) foundProduct = item;
        });

        if(foundProduct) {
            let priceNumeric = parseInt(foundProduct.price.replace(/[^\d]/g, ''));
            let deliveryCharge = 150;
            let total = priceNumeric + deliveryCharge;

            document.getElementById('briefContent').innerHTML = `
                <div class="product-box">
                    <img src="${foundProduct.img}" alt="product">
                    <div>
                        <div style="font-size:15px; color:#666;">আপনার নির্বাচন:</div>
                        <div style="font-size:16px; font-weight:600; margin:5px 0;">${foundProduct.title}</div>
                        <div class="price-text">৳ ${priceNumeric}</div>
                        <div style="font-size:13px; color:#888; margin-top:5px;">ডেলিভারি চার্জ: ৳ ${deliveryCharge}</div>
                        <div style="font-size:17px; font-weight:700; color:var(--brand-color); margin-top:5px;">মোট: ৳ ${total}</div>
                    </div>
                </div>
            `;

            const myNum = "8801700000000";
            const text = `আসসালামু আলাইকুম, আমি KINO থেকে এই পণ্যটি কিনতে চাই:\n\nপণ্য: ${foundProduct.title}\nমূল্য: ৳${priceNumeric}\nডেলিভারি চার্জ: ৳${deliveryCharge}\nমোট দাম: ৳${total} টাকা`;
            
            document.getElementById('waLink').href = `https://wa.me/${myNum}?text=${encodeURIComponent(text)}`;
            document.getElementById('msLink').href = `https://m.me/YOUR_PAGE_USERNAME`; 
        } else {
            document.getElementById('briefContent').innerHTML = "<p style='text-align:center;'>পণ্যটি পাওয়া যায়নি!</p>";
        }
    }
</script>
</body>
</html>
