<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | KINO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #f8fafc; margin: 0; padding: 20px; }
        .details-card { background: white; padding: 20px; border-radius: 20px; max-width: 500px; margin: auto; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .prod-img { width: 100%; height: 300px; background-size: cover; background-position: center; border-radius: 15px; }
        .prod-title { font-size: 22px; font-weight: 800; margin: 20px 0 10px; }
        .prod-price { font-size: 20px; color: #5c46e4; font-weight: 700; margin-bottom: 20px; }
        .back-btn { display: inline-block; padding: 10px 20px; background: #0f172a; color: white; border-radius: 10px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="details-card" id="details-container">
        <p>Loading product...</p>
    </div>

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const pName = params.get('name');
            const container = document.getElementById('details-container');

            // LocalStorage থেকে ডাটা নেওয়া
            const db = JSON.parse(localStorage.getItem('wordrobe_db'));
            let foundProduct = null;

            // সব ক্যাটাগরি থেকে প্রোডাক্টটি খোঁজা
            Object.keys(db).forEach(key => {
                const item = db[key].find(p => p.title === pName);
                if (item) foundProduct = item;
            });

            if (foundProduct) {
                container.innerHTML = `
                    <div class="prod-img" style="background-image: url('${foundProduct.img}')"></div>
                    <div class="prod-title">${foundProduct.title}</div>
                    <div class="prod-price">${foundProduct.price}</div>
                    <a href="index.html" class="back-btn">Go Back</a>
                `;
            } else {
                container.innerHTML = "<h3>Product not found!</h3><a href='index.html'>Back to Home</a>";
            }
        };
    </script>
</body>
</html>
