<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | KINO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --brand-purple: #960000; --bg-light: #f8fafc; --text-dark: #0f172a; --text-slate: #475569; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-light); color: var(--text-dark); margin: 0; padding-bottom: 90px; }
        .nav-bar { padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; background: white; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #eee; }
        .product-hero { background: white; padding: 20px; border-radius: 0 0 30px 30px; margin-bottom: 15px; }
        .gallery-container { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 15px; scroll-snap-type: x mandatory; }
        .gallery-container img { min-width: 100%; height: 320px; object-fit: cover; border-radius: 20px; scroll-snap-align: center; background-color: #f1f5f9; }
        .section-box { padding: 0 20px 20px 20px; }
        .review-card { background: white; padding: 15px; border-radius: 15px; margin-top: 10px; border: 1px solid #f1f5f9; color: var(--text-slate); font-style: italic; }
        .footer-btns { position: fixed; bottom: 0; width: 100%; display: flex; gap: 8px; padding: 10px 15px; background: white; border-top: 1px solid #eee; box-sizing: border-box; }
        .btn { flex: 1; padding: 14px 5px; border-radius: 12px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; }
        .btn-cart { background: #e0e7ff; color: var(--brand-purple); }
        .btn-buy { background: var(--brand-purple); color: white; }
    </style>
</head>
<body>

<div class="nav-bar">
    <i class="fa-solid fa-arrow-left" onclick="history.back()"></i> 
    <b style="font-size:16px;">Product Details</b>
    <i class="fa-solid fa-bag-shopping" onclick="location.href='cart.html'"></i>
</div>

<div id="product-details-content">
    <p style="text-align:center; margin-top:50px;">Loading product...</p>
</div>

<div class="section-box">
    <h3>Customer Reviews</h3>
    <div class="review-card">
        <i class="fa-solid fa-clock"></i> Review section is coming soon!
    </div>
</div>

<div class="section-box">
    <h3>Related Products</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;" id="suggestion-list"></div>
</div>

<div class="footer-btns">
    <button class="btn btn-cart" id="add-to-cart-btn">Add to Cart</button>
    <button class="btn btn-buy" id="buy-now-btn">Checkout Now</button>
</div>

<script>
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const pName = params.get('name');
        const db = JSON.parse(localStorage.getItem('wordrobe_db')) || {};
        
        let foundProduct = null;
        let allProducts = [];

        Object.keys(db).forEach(key => {
            allProducts = allProducts.concat(db[key]);
            const item = db[key].find(p => p.title === pName);
            if (item) foundProduct = item;
        });

        if (foundProduct) {
            let imagesHTML = (foundProduct.images && foundProduct.images.length > 0) 
                ? foundProduct.images.map(img => `<img src="${img.trim()}">`).join('')
                : `<img src="${foundProduct.img}">`;

            document.getElementById('product-details-content').innerHTML = `
                <div class="product-hero">
                    <div class="gallery-container">${imagesHTML}</div>
                    <h1>${foundProduct.title}</h1>
                    <p style="font-size: 22px; color: var(--brand-purple); font-weight: 800;">${foundProduct.price}</p>
                    <p style="color: var(--text-slate); line-height: 1.6; font-size: 15px;">${foundProduct.desc || "No description available."}</p>
                </div>
            `;

            // কার্ট লজিক
            document.getElementById('add-to-cart-btn').onclick = function() {
                let cart = JSON.parse(localStorage.getItem('cart')) || [];
                cart.push(foundProduct);
                localStorage.setItem('cart', JSON.stringify(cart));
                window.dispatchEvent(new Event('cartUpdated'));
                alert('🛍️ "' + foundProduct.title + '" added to your bag!');
            };

            // Checkout বাটন লজিক (নামসহ চেকআউটে পাঠানো)
            document.getElementById('buy-now-btn').onclick = function() {
                location.href = 'checkout.html?name=' + encodeURIComponent(foundProduct.title);
            };

            // সাজেশন সেকশন
            const sugList = document.getElementById('suggestion-list');
            allProducts.filter(p => p.title !== pName).slice(0, 2).forEach(p => {
                sugList.innerHTML += `
                    <div style="background:white; padding:10px; border-radius:15px;" onclick="location.href='product.html?name=${encodeURIComponent(p.title)}'">
                        <img src="${p.img}" style="width:100%; height:120px; object-fit:cover; border-radius:10px;">
                        <p style="font-size:12px; font-weight:600; margin:10px 0;">${p.title}</p>
                    </div>
                `;
            });
        } else {
            document.getElementById('product-details-content').innerHTML = `<p style="text-align:center;">Product not found!</p>`;
        }
    };
</script>
</body>
</html>
