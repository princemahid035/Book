<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | MYGRAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --brand: #E68A00; --dark: #1A202C; --blue: #0066cc; --bg: #F7FAFC; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding-bottom: 100px; color: #333; }
        
        .product-container { max-width: 600px; margin: 0 auto; background: #fff; min-height: 100vh; }
        
        .main-img-box { width: 100%; height: 400px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fff; }
        .main-img-box img { max-width: 100%; height: 100%; object-fit: cover; }
        
        .product-info { padding: 24px; }
        .p-title { font-size: 24px; font-weight: 700; color: var(--dark); margin: 0 0 12px 0; }
        .p-price { font-size: 28px; font-weight: 800; color: var(--blue); margin-bottom: 20px; }
        
        .section-box { padding: 24px; border-top: 8px solid #F7FAFC; }
        h3 { margin-top: 0; font-size: 18px; }
        
        .review-input { background: #F7FAFC; border-radius: 12px; padding: 20px; }
        .review-input input, .review-input textarea { width: 100%; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; outline: none; }
        .btn-rev { background: var(--brand); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
        
        .bottom-actions { position: fixed; bottom: 0; width: 100%; max-width: 600px; background: #fff; padding: 15px; display: flex; gap: 10px; box-sizing: border-box; border-top: 1px solid #edf2f7; }
        .btn-cart { flex: 1; padding: 16px; border-radius: 12px; border: 2px solid var(--blue); color: var(--blue); background: #fff; font-weight: 700; }
        .btn-buy { flex: 1; padding: 16px; border-radius: 12px; border: none; background: var(--dark); color: #fff; font-weight: 700; }
    </style>
</head>
<body>

<div class="product-container" id="main-content">
    <p style="padding:50px; text-align:center;">Loading product details...</p>
</div>

<div class="bottom-actions" id="action-buttons" style="display:none;">
    <button class="btn-cart">Add to Cart</button>
    <button class="btn-buy" id="buyBtn">Buy Now</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDHVxHXy2z2hUSnIvefnwN9y6CjEWA7GdY",
        authDomain: "mygram-1c209.firebaseapp.com",
        databaseURL: "https://mygram-1c209-default-rtdb.firebaseio.com",
        projectId: "mygram-1c209",
        storageBucket: "mygram-1c209.firebasestorage.app",
        messagingSenderId: "274881521531",
        appId: "1:274881521531:web:eff6ef5fee127afb69bfde"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    if (!productId) {
        document.getElementById('main-content').innerHTML = "<p style='padding:50px'>Product not found!</p>";
    } else {
        loadProduct();
    }

    function loadProduct() {
        db.ref('products/' + productId).once('value').then((snapshot) => {
            const p = snapshot.val();
            document.getElementById('main-content').innerHTML = `
                <div class="main-img-box"><img src="${p.img}"></div>
                <div class="product-info">
                    <h1 class="p-title">${p.name}</h1>
                    <div class="p-price">$${p.price}</div>
                    <p style="color:#666; line-height:1.6;">${p.desc || 'No description available.'}</p>
                </div>
                <div class="section-box">
                    <h3>Customer Reviews</h3>
                    <div class="review-input">
                        <input type="text" id="rName" placeholder="Your Name">
                        <textarea id="rText" rows="3" placeholder="Write your review..."></textarea>
                        <button class="btn-rev" onclick="addReview()">Submit Review</button>
                    </div>
                    <div id="reviewDisplay" style="margin-top:20px;"></div>
                </div>
            `;
            document.getElementById('action-buttons').style.display = 'flex';
            loadReviews();
        });
    }

    function addReview() {
        const name = document.getElementById('rName').value;
        const text = document.getElementById('rText').value;
        if (!name || !text) return alert("Please fill all fields");
        db.ref('reviews/' + productId).push({ name, text, date: new Date().toLocaleDateString() });
        document.getElementById('rName').value = "";
        document.getElementById('rText').value = "";
    }

    function loadReviews() {
        db.ref('reviews/' + productId).on('value', (s) => {
            const reviews = s.val();
            let html = "";
            for (let k in reviews) {
                html = `<div style="padding:10px 0; border-bottom:1px solid #eee;"><strong>${reviews[k].name}</strong><p style="margin:5px 0;">${reviews[k].text}</p></div>` + html;
            }
            document.getElementById('reviewDisplay').innerHTML = html || "No reviews yet.";
        });
    }
</script>
</body>
</html>
