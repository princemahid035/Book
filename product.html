<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | KINO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-purple: #5c46e4;
            --bg-pure: #ffffff;
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
            --text-slate: #475569;
            --premium-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-light); color: var(--text-dark); margin: 0; padding: 20px; }
        
        .product-page-container { max-width: 500px; margin: 0 auto; }
        
        .back-nav { margin-bottom: 20px; }
        .back-nav a { color: var(--text-slate); text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        .luxury-card { background: var(--bg-pure); border-radius: 24px; padding: 20px; box-shadow: var(--premium-shadow); border: 1px solid rgba(241, 245, 249, 0.5); }
        
        .main-img { width: 100%; height: 350px; background-size: cover; background-position: center; border-radius: 20px; margin-bottom: 20px; background-color: #f1f5f9; }
        
        .prod-info h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
        .prod-price { font-size: 20px; font-weight: 700; color: var(--brand-purple); margin-bottom: 20px; }
        
        .action-area { display: flex; gap: 12px; margin-top: 20px; }
        .btn-main { flex: 1; padding: 16px; border-radius: 14px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-buy { background: var(--brand-purple); color: white; }
        .btn-back { background: #f1f5f9; color: var(--text-dark); }
    </style>
</head>
<body>

<div class="product-page-container" id="details-container">
    <div class="back-nav"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Store</a></div>
    <p style="text-align:center; margin-top:50px;">Loading product details...</p>
</div>

<script>
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const pName = params.get('name');
        const container = document.getElementById('details-container');

        const db = JSON.parse(localStorage.getItem('wordrobe_db'));
        let foundProduct = null;

        Object.keys(db).forEach(key => {
            const item = db[key].find(p => p.title === pName);
            if (item) foundProduct = item;
        });

        if (foundProduct) {
            container.innerHTML = `
                <div class="back-nav"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Store</a></div>
                <div class="luxury-card">
                    <div class="main-img" style="background-image: url('${foundProduct.img}')"></div>
                    <div class="prod-info">
                        <h1>${foundProduct.title}</h1>
                        <div class="prod-price">${foundProduct.price}</div>
                        <p style="color: var(--text-slate); font-size: 14px; line-height: 1.6;">
                            Experience the premium quality of ${foundProduct.title}. Perfectly crafted for your lifestyle needs.
                        </p>
                    </div>
                    <div class="action-area">
                        <button class="btn-main btn-back" onclick="history.back()">Close</button>
                        <button class="btn-main btn-buy" onclick="alert('Checkout process for ${foundProduct.title} started!')">
                            <i class="fa-solid fa-bag-shopping"></i> Buy Now
                        </button>
                    </div>
                </div>
            `;
        } else {
            container.innerHTML = "<div class='luxury-card'><h3>Product not found!</h3><a href='index.html'>Go Home</a></div>";
        }
    };
</script>

</body>
</html>
